services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    read_only: false
    tmpfs:
      - /tmp/jvm-lens:size=256m,mode=1777
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - internal
networks:
  internal:
    driver: bridge
    internal: true
