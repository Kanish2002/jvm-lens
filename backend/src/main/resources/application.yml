spring:
  application:
    name: jvm-lens

server:
  address: 0.0.0.0
  port: ${PORT:8080}

jvm-lens:
  workspace: ${JVM_LENS_WORKSPACE:/tmp/jvm-lens}
  max-steps: ${JVM_LENS_MAX_STEPS:1000}
  max-history: ${JVM_LENS_MAX_HISTORY:400}
  session-ttl-seconds: ${JVM_LENS_SESSION_TTL_SECONDS:900}
  cleanup-interval-ms: ${JVM_LENS_CLEANUP_INTERVAL_MS:60000}
  max-concurrent-executions: ${JVM_LENS_MAX_CONCURRENT_EXECUTIONS:2}
  max-source-bytes: ${JVM_LENS_MAX_SOURCE_BYTES:256000}
  max-output-bytes: ${JVM_LENS_MAX_OUTPUT_BYTES:131072}
  max-objects: ${JVM_LENS_MAX_OBJECTS:150}
  max-depth: ${JVM_LENS_MAX_DEPTH:3}
  max-array-elements: ${JVM_LENS_MAX_ARRAY_ELEMENTS:50}
